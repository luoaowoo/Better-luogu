<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better-luogu 设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="loe-options-page">
  <main class="loe-options">
    <h1>Better-luogu（更好的洛谷）</h1>
    <nav class="loe-tabs" aria-label="插件页面">
      <button class="loe-tab is-active" type="button" data-tab="settings">设置</button>
      <button class="loe-tab" type="button" data-tab="weekly">本周总结</button>
    </nav>

    <section class="loe-tab-page" data-page="settings">
      <label>
        <span>API Base URL</span>
        <input id="baseURL" type="url" placeholder="https://api.openai.com/v1">
      </label>
      <label>
        <span>API Key</span>
        <input id="apiKey" type="password" placeholder="sk-...">
      </label>
      <label>
        <span>Model</span>
        <input id="model" type="text" placeholder="gpt-4o-mini">
      </label>
      <label class="loe-check">
        <input id="manualOnly" type="checkbox">
        <span>只在点击后分析</span>
      </label>
      <button id="save" type="button">保存</button>
      <p id="status"></p>
    </section>

    <section class="loe-tab-page" data-page="weekly" hidden>
      <div id="weeklyStatus" class="loe-popup-status">读取最近 7 天本地记录，点击后生成训练复盘。</div>
      <div class="loe-actions loe-popup-actions loe-weekly-actions">
        <button id="weeklySummary" type="button">生成本周总结</button>
      </div>
      <div id="weeklyOutput" class="loe-output loe-popup-output"></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
